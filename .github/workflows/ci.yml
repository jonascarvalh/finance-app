name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar SQLite (testes de integração)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Dependências
        run: flutter pub get

      # Em caso de falha, o resultado também aparece como anotação no resumo do workflow.
      - name: Análise estática
        run: |
          if ! flutter analyze > analyze.txt 2>&1; then
            cat analyze.txt
            echo "::error title=flutter analyze::$(tail -c 60000 analyze.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
          cat analyze.txt

      - name: Testes
        run: |
          if ! flutter test > test.txt 2>&1; then
            cat test.txt
            echo "::error title=flutter test::$(grep -v '^[0-9]*:[0-9]* +[0-9]*' test.txt | tail -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
          tail -n 5 test.txt
